name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.platform.os }}
    env:
      VCPKG_DISABLE_METRICS: '1'
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-debug, ninja-release]
        platform:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            cc: ""
            cxx: ""
          - name: macos-appleclang
            os: macos-latest
            cc: clang
            cxx: clang++
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set vcpkg root
        shell: python
        run: |
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'vcpkg'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              print(f'VCPKG_ROOT={root}', file=output)

      - name: install vcpkg (linux and macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach 74e6536215718009aae747d86d84b78376bf9e09
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: install vcpkg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT checkout --detach 74e6536215718009aae747d86d84b78376bf9e09
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: test project initialization
        run: python -m unittest discover -s scripts/tests

      - name: prepare host tools (linux and macos)
        if: runner.os != 'Windows'
        run: bash scripts/setup.sh --install

      - name: prepare host tools (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/setup.ps1
          $setupStatus = Invoke-ProjectSetup -InstallTools $true -CacheTool sccache
          if ($setupStatus -ne 0) { exit $setupStatus }
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: configure MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locator = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ tools were not found.' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $?) { exit 1 }
          Get-ChildItem Env: | Where-Object Name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH') | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: configure
        env:
          CC: ${{ matrix.platform.cc }}
          CXX: ${{ matrix.platform.cxx }}
        run: cmake --preset ${{ matrix.preset }} -D CPP_TEMPLATE_WARNINGS_AS_ERRORS=ON

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        if: matrix.preset == 'ninja-release'
        run: ctest --preset ${{ matrix.preset }}
